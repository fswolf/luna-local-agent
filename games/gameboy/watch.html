<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna plays the Game Boy</title>
<style>
  :root { --bg: #120d1c; --panel: #1a1328; --line: #3a2d55; --text: #d9d4ec; --dim: #8880a8; --accent: #e07ac8;
          --live: #ff5c7a; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  /* one column: the game on top, what she says under it, her moves beside that on a wide window */
  main { max-width: 720px; margin: 0 auto; padding: 18px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 18px; color: var(--accent); font-weight: 600; }
  .side { display: grid; gap: 12px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
  .side .note { grid-column: 1 / -1; margin: 0; }
  @media (max-width: 640px) { .side { grid-template-columns: 1fr; } }

  /* the handheld: a bezel round the screen, the screen itself drawn at whole-pixel sharpness */
  .shell { background: linear-gradient(160deg, #2a2140, #1d1630); border-radius: 18px 18px 46px 18px;
           padding: 18px 18px 22px; box-shadow: 0 0 0 1px var(--line), 0 14px 40px rgba(0,0,0,.45); }
  .bezel { background: #0d0a14; border-radius: 10px; padding: 16px 22px 18px; position: relative; }
  .led { position: absolute; left: 8px; top: 50%; width: 7px; height: 7px; border-radius: 50%;
         background: #3b2f4f; transform: translateY(-50%); transition: background .3s, box-shadow .3s; }
  .led.on { background: var(--live); box-shadow: 0 0 8px var(--live); }
  .screen { position: relative; cursor: zoom-in; }
  canvas { display: block; width: 100%; aspect-ratio: 160 / 144; image-rendering: pixelated;
           image-rendering: crisp-edges; background: #000; border-radius: 3px; }
  .over { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 1rem;
          background: rgba(13,10,20,.78); color: var(--dim); font-size: 14px; border-radius: 3px; }
  .over[hidden] { display: none; }

  .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .tag b { font-weight: 600; letter-spacing: .08em; color: var(--live); }
  .buttons { display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: var(--panel); color: var(--dim); border: 1px solid var(--line); border-radius: 8px;
           padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  button:hover { color: var(--text); border-color: var(--accent); }
  button.on { color: var(--accent); border-color: var(--accent); }
  button[hidden] { display: none; }

  .note { margin-bottom: 12px; color: #f0c674; font-size: 13px; }
  .note[hidden] { display: none; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .said { font-size: 16px; min-height: 3em; }
  .dim { color: var(--dim); font-size: 13px; }
  ul { margin: 6px 0 0; padding-left: 18px; color: var(--dim); font-size: 13px; }
  ul li:first-child { color: var(--text); }

  /* full screen, and #screen for an OBS browser source: the game and nothing else */
  .screen:fullscreen { background: #000; display: grid; place-items: center; cursor: zoom-out; }
  .screen:fullscreen canvas { width: auto; height: 100vh; max-width: 100vw; border-radius: 0; }
  body.only { background: transparent; }
  body.only main { display: block; padding: 0; max-width: none; }
  body.only h1, body.only .side, body.only .bar, body.only .led { display: none; }
  body.only .shell, body.only .bezel { background: none; box-shadow: none; padding: 0; border-radius: 0; }
  body.only canvas { width: 100vw; height: 100vh; aspect-ratio: auto; object-fit: contain; border-radius: 0;
                    background: transparent; }
  body.only #luna-nav, body.only #luna-head, body.only .over { display: none !important; }   /* her header or the page switcher, in OBS */
</style>
</head>
<body>
<main>
  <h1 id="title">Game Boy</h1>
  <div>
    <div class="shell">
      <div class="bezel">
        <span class="led" id="led" title="lit while the game is running"></span>
        <div class="screen" id="screen" title="click for full screen">
          <canvas id="lcd" width="160" height="144" aria-label="The Game Boy's screen"></canvas>
          <div class="over" id="over">waiting for the Game Boy...</div>
        </div>
      </div>
    </div>
    <div class="bar">
      <span class="tag" id="mode"></span>
      <span class="buttons">
        <button id="palette" title="The original Game Boy's green screen, for games made for it">green screen</button>
        <button id="music" hidden title="The game's sound, in this browser">music off</button>
        <button id="big" title="Full screen (or click the game)">full screen</button>
      </span>
    </div>
  </div>
  <div class="side">
    <div class="panel note" id="note" hidden></div>
    <div class="panel"><div class="dim" id="turn">waiting...</div><div class="said" id="said"></div></div>
    <div class="panel"><div class="dim">her last moves</div><ul id="notes"></ul></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const store = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch (_) { return null; } };
if (location.hash === '#screen') document.body.classList.add('only');     // OBS: /gameboy/#screen

let live = false, on = false, lastFrame = 0, wanted = false;   // wanted: the music button is on

// What she's doing.
async function tick() {
  try {
    const s = await (await fetch('state', { cache: 'no-store' })).json();
    on = true;
    $('title').textContent = 'Luna plays ' + (s.title || 'the Game Boy');
    document.title = 'Luna plays ' + (s.title || 'the Game Boy');
    $('turn').textContent = (s.playing ? 'playing' : 'paused') + (s.turn ? ` · turn ${s.turn}` : '');
    $('said').textContent = s.said || '';
    $('notes').replaceChildren(...(s.notes || []).slice().reverse().map(n => Object.assign(document.createElement('li'), { textContent: n })));
    live = !!s.live;
    $('music').hidden = !s.music;
    $('note').hidden = !(s.music_note && wanted);
    $('note').textContent = s.music_note || '';
  } catch (_) { on = false; $('turn').textContent = 'the Game Boy is off'; }
  showMode();
}

function showMode() {
  const running = on && live && Date.now() - lastFrame < 2000;
  $('led').classList.toggle('on', running);
  $('mode').replaceChildren();
  if (running) $('mode').append(Object.assign(document.createElement('b'), { textContent: 'LIVE' }), ' running in real time');
  else $('mode').textContent = !on ? 'the Game Boy is off' : live ? 'starting...' : 'the screen after each of her moves ("live" in the settings shows it running)';
  const over = $('over');
  over.hidden = on && lastFrame > 0;
  over.textContent = on ? 'waiting for the first picture...' : 'The Game Boy is off. /gameboy on in Luna.';
}
tick();
setInterval(tick, 1500);

// The screen: fetched (never cached, so a long watch doesn't fill the browser's cache),
// drawn onto a 160x144 canvas so the pixels stay square at any size. About 30 a
// second when it's live, after each move when it isn't; one at a time, never piling up.
const lcd = $('lcd'), ctx = lcd.getContext('2d', { willReadFrequently: true });
ctx.imageSmoothingEnabled = false;
let green = store('gb-green') === 'on';

// The original Game Boy's four shades of green, for a game drawn in its four greys.
const GREEN = [[155, 188, 15], [139, 172, 15], [48, 98, 48], [15, 56, 15]];
function tint() {
  const img = ctx.getImageData(0, 0, lcd.width, lcd.height), px = img.data;
  for (let i = 0; i < px.length; i += 4) if (px[i] !== px[i + 1] || px[i] !== px[i + 2]) return;   // colour game: leave it
  for (let i = 0; i < px.length; i += 4) {
    const v = px[i], c = GREEN[v > 200 ? 0 : v > 120 ? 1 : v > 40 ? 2 : 3];
    px[i] = c[0]; px[i + 1] = c[1]; px[i + 2] = c[2];
  }
  ctx.putImageData(img, 0, 0);
}

async function frame() {
  try {
    const r = await fetch('live.png', { cache: 'no-store' });
    if (r.ok) {
      const bmp = await createImageBitmap(await r.blob());
      if (lcd.width !== bmp.width || lcd.height !== bmp.height) {     // the after-move picture is 3x
        lcd.width = bmp.width; lcd.height = bmp.height; ctx.imageSmoothingEnabled = false;
      }
      ctx.drawImage(bmp, 0, 0);
      bmp.close && bmp.close();
      if (green) tint();
      lastFrame = Date.now();
      if (!$('over').hidden && on) showMode();
    }
  } catch (_) {}
  setTimeout(frame, live && on ? 33 : 1000);
}
frame();

function palette(onOff) {
  green = onOff;
  store('gb-green', onOff ? 'on' : 'off');
  $('palette').classList.toggle('on', onOff);
}
palette(green);
$('palette').onclick = () => palette(!green);

// Full screen: the button, or a click on the game.
function big() {
  if (document.fullscreenElement) document.exitFullscreen();
  else $('screen').requestFullscreen && $('screen').requestFullscreen();
}
$('big').onclick = big;
$('screen').onclick = big;

// The game's sound, only when you ask for it (a browser won't play before a click anyway).
// Quarter-second chunks of 24 kHz mono, queued a moment ahead so they play back to back.
let audio = null, seq = 0, ahead = 0, polling = false;

async function pull() {
  if (!wanted || polling) return;
  polling = true;
  try {
    const r = await fetch('audio/' + seq, { cache: 'no-store' });
    if (r.status === 200) {
      const buf = await r.arrayBuffer();
      seq = new DataView(buf).getUint32(0);
      const samples = new Int8Array(buf, 4);
      if (samples.length && wanted) {
        const clip = audio.createBuffer(1, samples.length, 24000);
        const out = clip.getChannelData(0);
        for (let i = 0; i < samples.length; i++) out[i] = samples[i] / 128;
        const src = audio.createBufferSource();
        src.buffer = clip;
        src.connect(audio.destination);
        ahead = Math.max(ahead, audio.currentTime + 0.3);
        src.start(ahead);
        ahead += clip.duration;
      }
    }
  } catch (_) {}
  polling = false;
}
setInterval(pull, 100);

function music(onOff) {
  wanted = onOff;
  $('music').textContent = onOff ? 'music on' : 'music off';
  $('music').classList.toggle('on', onOff);
  if (audio) { audio.close(); audio = null; }     // nothing queued from before plays on later
  if (onOff) { audio = new AudioContext(); ahead = 0; }
}
$('music').onclick = () => { music(!wanted); tick(); };
</script>
</body>
</html>
