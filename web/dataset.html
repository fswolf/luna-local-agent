<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna, examples</title>
<style>
:root{--bg:#0e0a16;--panel:#161021;--line:#2c2140;--text:#e6dcff;--dim:#9a8dbb;--accent:#c49dff;--pink:#ff8fd0;--ok:#7fe0a8;--warn:#ffcf7a;--bad:#ff8a8a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#0e0a16f2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px 12px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:980px;margin:0 auto}
h1{font-size:17px;margin:0;color:var(--pink);letter-spacing:.3px}
h1 small{color:var(--dim);font-weight:400;font-size:13px;margin-left:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:var(--dim);padding:7px 12px;font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:#14081c}
.counts{color:var(--dim);font-size:12.5px;flex:1;text-align:right}
main{max-width:980px;margin:0 auto;padding:16px 20px 90px}
.empty{color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.empty code{background:#0e0a16;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.ex{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.ex.yes{border-left-color:var(--ok)}.ex.no{border-left-color:var(--bad);opacity:.7}.ex.wait{border-left-color:var(--warn)}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-bottom:8px}
.meta select{background:#0e0a16;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:2px 6px;font:inherit}
.badge{border-radius:999px;padding:1px 8px;font-size:11px;color:#14081c}
.badge.yes{background:var(--ok)}.badge.no{background:var(--bad)}.badge.wait{background:var(--warn)}
.who{font-size:12px;color:var(--dim);margin:8px 0 3px}
.said{white-space:pre-wrap;background:#0e0a16;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.was{white-space:pre-wrap;color:var(--dim);text-decoration:line-through;text-decoration-color:#ff8a8a80;font-size:13px}
textarea{width:100%;min-height:90px;resize:vertical;background:#0e0a16;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit}
textarea:focus{outline:none;border-color:var(--accent)}
details{margin-top:8px;color:var(--dim);font-size:12.5px}
details pre{white-space:pre-wrap;max-height:320px;overflow:auto;background:#0e0a16;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts button{background:none;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit}
.acts button:hover{background:var(--accent);color:#14081c}
.acts button.bad{border-color:var(--bad);color:var(--bad)}.acts button.bad:hover{background:var(--bad);color:#14081c}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}#toast.bad{border-color:var(--bad)}
</style>
</head><body>
<header><div class="top">
  <h1>Luna <small>examples for her patches</small></h1>
  <div class="seg" id="kinds"><button data-k="" class="on">All</button><button data-k="habit">Habits</button><button data-k="gesture">Gestures</button></div>
  <div class="seg" id="states"><button data-s="" class="on">Any</button><button data-s="wait">Waiting</button><button data-s="yes">Approved</button><button data-s="no">Dropped</button></div>
  <div class="counts" id="counts"></div>
</div></header>
<main><div id="list"></div></main>
<div id="toast"></div>
<script>
let KEY = "__KEY__";        // this run of Luna's; a restart makes a new one (see send)
let rows = [], kind = "", state = "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stateOf = r => r.approved === true ? "yes" : r.approved === false ? "no" : "wait";
const WORD = {yes: "approved", no: "dropped", wait: "waiting"};

function toast(text, bad) {
  const t = $("#toast"); t.textContent = text; t.className = "show" + (bad ? " bad" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "", 2400);
}

async function load() {
  const data = await (await fetch("api", {cache: "no-store"})).json();
  rows = data.examples; counts(data.counts); render();
}

function counts(c) {
  $("#counts").textContent = Object.entries(c).map(([k, n]) =>
    `${k}: ${n.approved} approved, ${n.waiting} waiting`).join(" · ");
}

const post = body => fetch("api", {method: "POST", headers: {"Content-Type": "application/json"},
                                   body: JSON.stringify(Object.assign({}, body, {key: KEY}))});

// Luna was restarted since this page loaded: read the new key from the page itself.
async function freshKey() {
  try {
    const page = await (await fetch("./", {cache: "no-store"})).text();
    const m = page.match(/KEY = "([A-Za-z0-9_-]+)"/);
    if (m) { KEY = m[1]; return true; }
  } catch (e) {}
  return false;
}

async function send(body) {
  let r, out = {};
  try {
    r = await post(body);
    if (r.status === 403 && await freshKey()) r = await post(body);
    out = await r.json();
  } catch (e) { out = {ok: false, message: "no answer from Luna - is she running?"}; }
  if (out.counts) counts(out.counts);
  return out;
}

function card(r) {
  const s = stateOf(r);
  const ctx = (r.context || []).map(m => `${m.role === "user" ? "You" : "Luna"}: ${m.content}`).join("\n\n");
  return `<div class="ex ${s}" data-id="${esc(r.id)}">
    <div class="meta"><span class="badge ${s}">${WORD[s]}</span>
      <select data-kind>${["habit", "gesture"].map(k => `<option${k === r.kind ? " selected" : ""}>${k}</option>`).join("")}</select>
      <span>${esc(r.source)} · ${esc(r.when)} · ${esc(r.model)}</span></div>
    <div class="who">You said</div><div class="said">${esc(r.said)}</div>
    ${r.original ? `<div class="who">She said</div><div class="was">${esc(r.original)}</div>` : ""}
    <div class="who">${r.original ? "Your version (what she learns)" : "Her reply (what she learns)"}</div>
    <textarea data-reply>${esc(r.reply)}</textarea>
    <details><summary>the conversation before (${(r.context || []).length} turns) and her prompt</summary>
      ${ctx ? `<pre>${esc(ctx)}</pre>` : ""}<pre>${esc(r.system)}</pre></details>
    <div class="acts">
      <button data-act="approve">Approve</button>
      <button data-act="drop">Drop (keep, never train)</button>
      <button data-act="delete" class="bad">Delete</button>
    </div></div>`;
}

function render() {
  const shown = rows.filter(r => (!kind || r.kind === kind) && (!state || stateOf(r) === state));
  $("#list").innerHTML = shown.length ? shown.map(card).join("") :
    `<div class="empty">${rows.length ? "Nothing here with these filters." :
      "No examples yet. In Luna, <code>/good</code> keeps her last reply as an example and " +
      "<code>/fix &lt;better reply&gt;</code> keeps your version of it. She never sees either."}</div>`;
}

function rowOf(el) { const id = el.closest(".ex").dataset.id; return rows.find(r => r.id === id); }

$("#list").addEventListener("click", async e => {
  const act = e.target.dataset.act;
  if (!act) return;
  const r = rowOf(e.target);
  if (act === "delete" && !confirm("Delete this example for good?")) return;
  const out = await send({action: act, example: r.id});
  if (!out.ok) return toast(out.message, true);
  if (act === "delete") rows = rows.filter(x => x !== r);
  else r.approved = act === "approve";
  render(); toast(act === "delete" ? "deleted" : act === "approve" ? "approved" : "dropped");
});

$("#list").addEventListener("change", async e => {
  const r = rowOf(e.target);
  if (e.target.matches("[data-kind]")) {
    const out = await send({action: "kind", example: r.id, kind: e.target.value});
    if (!out.ok) return toast(out.message, true);
    r.kind = e.target.value; toast("now a " + r.kind + " example");
  } else if (e.target.matches("[data-reply]") && e.target.value.trim() !== r.reply) {
    const out = await send({action: "edit", example: r.id, reply: e.target.value});
    if (!out.ok) return toast(out.message, true);
    r.original = r.original || r.reply; r.reply = e.target.value.trim(); render(); toast("saved");
  }
});

for (const [box, set] of [["#kinds", v => kind = v], ["#states", v => state = v]])
  $(box).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    $(box).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    set(b.dataset.k ?? b.dataset.s); render();
  });

load();
</script>
</body></html>
