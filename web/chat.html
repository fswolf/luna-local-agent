<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=theme-color content="#120d1c"><title>Luna · chat</title><style>
:root{--bg:#120d1c;--panel:#1a1328;--line:#3a2d55;--text:#ece6f7;--dim:#a49bc0;--accent:#ff87d7;--you:#3a2357;--her:#1f1830;
--ok:#7be0a8;--warn:#ffcf6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#log{flex:1;overflow-y:auto;overscroll-behavior:contain}
#list{max-width:860px;margin:0 auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:8px}
.hint{color:var(--dim);text-align:center;margin:30vh 10px 0}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.you{align-self:flex-start;background:var(--you);border-bottom-left-radius:5px}
.her{align-self:center;background:var(--her);border:1px solid var(--line)}
.her em{color:#d9b8ff}
.her strong{color:#fff;font-weight:650}
.her code{font:13px/1.45 ui-monospace,"Cascadia Mono",monospace;background:#0e0a16;border:1px solid var(--line);border-radius:5px;padding:0 4px}
.her .code{margin:6px 0;border:1px solid var(--line);border-radius:9px;background:#0e0a16;overflow:hidden;white-space:normal}
.her .code .bar{display:flex;align-items:center;justify-content:space-between;padding:3px 6px 3px 11px;background:#1b1428;border-bottom:1px solid var(--line);font:12px system-ui,sans-serif;color:var(--dim)}
.her .code button{background:none;border:0;color:var(--dim);cursor:pointer;padding:3px 5px;border-radius:6px;display:flex}
.her .code button:hover{color:var(--text);background:#2a2040}
.her .code button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.her .code pre{margin:0;padding:9px 11px;overflow-x:auto;white-space:pre}
.her .code pre code{border:0;padding:0;background:none}
.guest{align-self:flex-start;background:#16202a;border:1px solid #2b4050;border-bottom-left-radius:5px}
.who{display:block;font-size:12px;color:var(--dim);margin-bottom:2px}
.sys{align-self:flex-end;max-width:62%;color:#e9d9a6;background:#272012;border:1px solid #5a4a22;border-radius:12px;
border-bottom-right-radius:4px;padding:6px 11px;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
white-space:pre-wrap;overflow-wrap:anywhere;cursor:default}
.sys span{display:block}
.sys.long{cursor:pointer}.sys.long span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.sys.open{cursor:pointer}
.typing{align-self:center;background:var(--her);border:1px solid var(--line);border-radius:16px;
padding:12px 15px;display:none;gap:5px}
.typing.on{display:flex}
.typing i,.waiting i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
.typing i:nth-child(2),.waiting i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3),.waiting i:nth-child(3){animation-delay:.4s}
.msg.her.waiting{display:flex;gap:5px;padding:12px 15px}
.msg[hidden]{display:none}                     /* over .waiting's display:flex */   /* her reply before its first word: the dots, in it */
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.askwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;
background:#0a0612b3;backdrop-filter:blur(2px)}
.ask{width:min(760px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--panel);
border:1px solid var(--warn);border-radius:14px;padding:14px 16px;box-shadow:0 18px 60px #000a}
.ask b{color:var(--warn)}
.ask .note{color:var(--dim);font-size:14px}
.ask pre{white-space:pre-wrap;overflow-wrap:anywhere;flex:1;min-height:0;max-height:60vh;overflow:auto;background:#0e0a16;border:1px solid var(--line);
border-radius:8px;padding:8px;font-size:12.5px;color:var(--dim);margin:8px 0}
.ask .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ask .left{margin-left:auto;color:var(--dim);font-size:13px}
.btn{border:0;border-radius:12px;padding:8px 16px;font:600 14px system-ui,sans-serif;cursor:pointer;background:var(--accent);color:#14081c}
.btn.no{background:#2a2040;color:var(--text);border:1px solid var(--line)}
footer{flex:none;border-top:1px solid var(--line);background:var(--panel)}
#bar{max-width:860px;margin:0 auto;padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
#file{display:none}
.round{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#0e0a16;color:var(--dim);
font-size:19px;cursor:pointer;display:grid;place-items:center;padding:0}
.round:hover{color:var(--text);border-color:var(--accent)}
#send{background:var(--accent);color:#14081c;border:0}
#send.stop{background:#2a2040;color:var(--text);border:1px solid #ff5fb0}
#send:disabled{opacity:.4;cursor:default}
.box{flex:1;min-width:0;display:flex;flex-direction:column;background:#0e0a16;border:1px solid var(--line);border-radius:22px}
.box:focus-within{border-color:var(--accent)}
.line{display:flex;align-items:flex-end}
#mic{flex:none;width:34px;height:34px;margin:4px 6px 4px 0;border-radius:50%;border:0;background:none;color:var(--dim);
cursor:pointer;display:grid;place-items:center;padding:0;transition:color .15s,background .15s,box-shadow .15s}
#mic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#mic:hover{color:var(--text);background:#2a2040}
#mic[hidden]{display:none}
#mic.on{color:#14081c;background:var(--accent);box-shadow:0 0 0 6px #ff87d733;animation:hear 1.4s ease-in-out infinite}
@keyframes hear{50%{box-shadow:0 0 0 10px #ff87d722}}
#text{flex:1;min-width:0;font:inherit;color:var(--text);background:none;border:0;resize:none;padding:10px 16px;max-height:40vh;outline:none}
#chip{display:none;align-items:center;gap:8px;margin:8px 10px 0;padding:4px 6px 4px 10px;background:var(--panel);border:1px solid var(--line);
border-radius:12px;font-size:13px;color:var(--dim);align-self:flex-start;max-width:calc(100% - 20px)}
#chip.on{display:flex}
#chip img{height:42px;border-radius:6px}
#chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chip button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px}
#err{max-width:860px;margin:0 auto;padding:0 16px;color:#ff8fa3;font-size:13px;min-height:0}
#toast{position:fixed;left:50%;bottom:calc(var(--foot, 70px) + 16px);z-index:20;transform:translate(-50%,6px);max-width:min(90vw,560px);padding:8px 14px;border-radius:10px;
  background:#241a38;border:1px solid #ff8fa366;color:#ffc2cd;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#down{position:fixed;right:20px;bottom:calc(var(--foot, 70px) + 16px);display:none;width:38px;height:38px}
.rate{display:flex;gap:2px;justify-content:flex-end;align-items:center;margin:2px -7px -6px 0;opacity:0;transition:opacity .15s}
.msg.her:hover .rate,.rate.open,.rate:focus-within{opacity:1}
.rate.done{opacity:.55}
@media (hover:none){.rate{opacity:.5}}          /* phones and tablets: no hover, so always a little there */
.rate>button{display:grid;place-items:center;width:26px;height:24px;padding:0;background:none;border:0;border-radius:6px;
color:var(--dim);cursor:pointer}
.rate>button:hover{color:var(--text);background:#ffffff12}
.rate>button.on{color:var(--accent)}
.rate svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rate>button.on svg{fill:currentColor;fill-opacity:.18}
.rate .said{color:var(--dim);font-size:11.5px;margin-right:auto;padding-left:2px}
.better{display:flex;flex-direction:column;gap:6px;margin-top:6px;width:100%}
.better textarea{font:14px/1.4 system-ui,sans-serif;color:var(--text);background:#0e0a16;border:1px solid var(--line);border-radius:10px;
padding:7px 9px;resize:vertical;min-height:60px}
.better .row{display:flex;gap:6px;flex-wrap:wrap}
.better .btn{padding:5px 11px;font-size:13px}
body.drag #log{outline:2px dashed var(--accent);outline-offset:-8px}
</style></head><body>
<div id=log><div id=list><div class=hint>Say something. This is the same conversation as the terminal.</div>
<div class=typing id=typing><i></i><i></i><i></i></div></div></div>
<button class="round" id=down title="newest">↓</button>
<footer>
  <div id=err></div>
  <div id=toast role=status aria-live=polite></div>
  <div id=bar>
    <button class=round id=clip title="attach a picture or a file">📎</button>
    <input type=file id=file>
    <div class=box>
      <div id=chip><span id=chipname></span><button id=unclip title="remove">×</button></div>
      <div class=line><textarea id=text rows=1 placeholder="Say something" autocomplete=off></textarea>
      <button id=mic title="dictate into the box"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7"/></svg></button></div>
    </div>
    <button class=round id=send title="send (Enter)">➤</button>
  </div>
</footer>
<script>
const BOOT = __BOOT__;
const $ = s => document.querySelector(s);
const log = $('#log'), list = $('#list'), typing = $('#typing'), text = $('#text'), send = $('#send'), down = $('#down');
let offline = false, base = 0, msgs = [], els = [], v = null, e = null, busy = false, stoppable = false, streaming = null, attached = null, askId = null, askEl = null;
let replay = null;  // her reply being said again (the speaker button), by conversation index
let rates = {};   // her replies the thumbs can keep: conversation index -> "" | "up" | "down"

// her header (web/head.js, above this) is fed from these updates
const lunaHead = window.lunaHead || {update() {}, reachable() {}};   // a page served on its own has none
lunaHead.fed = true;

// --- drawing --------------------------------------------------------------
const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 80;
function show(fn) {
  const stick = atBottom();
  fn();
  if (stick) log.scrollTop = log.scrollHeight;
  pinned = atBottom();
  down.style.display = pinned ? 'none' : 'block';
}
log.addEventListener('scroll', () => { pinned = atBottom(); down.style.display = pinned ? 'none' : 'block'; });
down.onclick = () => { log.scrollTop = log.scrollHeight; };

// The box under the conversation grows as you type (up to 40% of the window),
// and a picked file adds its chip: the conversation's window gets shorter,
// and when you were at the bottom its last lines went under the box rather
// than moving up. Whether you were at the bottom is kept from before the
// change (after it, you aren't any more), and the buttons that float above
// the box move up with it.
let pinned = true;
new ResizeObserver(() => {
  document.body.style.setProperty('--foot', $('footer').offsetHeight + 'px');
  if (pinned) log.scrollTop = log.scrollHeight;
}).observe($('footer'));

function esc(s) { return s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
// her *actions* in italics; everything else exactly as written
// Her words as shown: ```code``` in a box of its own with a copy button
// (an unclosed one while it streams in shows as code already), `inline
// code`, **bold**, and *actions* kept in their asterisks, tinted.
function styled(s) {
  let out = '', at = 0;
  // a language only when the fence's line has nothing else on it: "```ls -la```"
  // on one line is a short block, not a block in language "ls" eating the rest
  const fence = /```(?:([\w+#.-]*)[ \t]*\n)?([\s\S]*?)(```|$)/g;
  for (const m of s.matchAll(fence)) {
    out += inline(s.slice(at, m.index).replace(/\n$/, ''));
    const lang = m[1] || '', code = m[2].replace(/\n$/, '');
    out += `<div class=code><div class=bar><span>${esc(lang || 'code')}</span>` +
           `<button class=copycode title="copy">${ICON.copy}</button></div><pre><code>${esc(code)}</code></pre></div>`;
    at = m.index + m[0].length;
    if (s[at] === '\n') at++;                // the box is a block: no blank line under it
  }
  return out + inline(s.slice(at));
}
function inline(s) {
  // `code` first, so nothing inside it turns bold or tinted
  return s.split(/(`[^`\n]+`)/).map((part, i) => i % 2 ? `<code>${esc(part.slice(1, -1))}</code>` :
    esc(part).replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>')
             .replace(/(^|[\s(])\*([^*\n]{1,200})\*(?=$|[\s.,!?;:)])/g, '$1<em>*$2*</em>')).join('');
}

function draw(el, speaker, words) {
  el.onclick = null;
  if (speaker === 'user') {
    el.className = 'msg you'; el.textContent = words;
  } else if (speaker === 'system') {
    el.className = 'sys'; el.replaceChildren(Object.assign(document.createElement('span'), {textContent: words}));
    if (words.split('\n').length > 2 || words.length > 240) el.classList.add('long');
    el.onclick = () => { if (getSelection().toString()) return; if (el.classList.contains('long') || el.classList.contains('open')) { el.classList.toggle('open'); el.classList.toggle('long'); } };
  } else if (speaker.startsWith('chat:')) {
    el.className = 'msg guest'; el.innerHTML = `<span class=who>${esc(speaker.slice(5))}</span>${esc(words)}`;
  } else {
    // her reply that's started but has no words yet: the dots, in her bubble (one bubble, not two)
    el.className = 'msg her' + (words.trim() ? '' : ' waiting');
    el.innerHTML = words.trim() ? styled(words) : '<i></i><i></i><i></i>';
  }
}

function apply(s) {
  if (s.reset || s.from < base) {
    for (const el of els) el.remove();
    els = []; msgs = []; base = s.from;
  }
  const keep = Math.max(0, s.from - base);
  show(() => {
    // redraw only what changed: a tool line you opened stays open, and text
    // you're selecting in an earlier message isn't swapped out under you
    s.msgs.forEach(([speaker, words], i) => {
      const at = keep + i, old = msgs[at];
      if (old && old[0] === speaker && old[1] === words) return;
      let el = els[at];
      if (!el) { el = document.createElement('div'); list.insertBefore(el, typing); els[at] = el; }
      draw(el, speaker, words);
      msgs[at] = [speaker, words];
    });
    for (const el of els.splice(keep + s.msgs.length)) el.remove();
    msgs.length = els.length;
    const hint = list.querySelector('.hint');
    if (hint && msgs.length) hint.remove();
    busy = s.busy; streaming = s.streaming;
    stoppable = s.stoppable ?? s.busy;      // anything Stop can end: a greeting, a reminder, a reply said again too
    rates = s.rate || {};
    replay = s.replay && s.replay[0] === e ? s.replay[1] : null;
    thumbs();
    // dots from your message until her first words (not while she's speaking a finished reply)
    const last = [...msgs].reverse().find(([who, words]) => who !== 'system' && words);
    // dots only in the reply being written: an empty one left behind shows nothing
    els.forEach((el, at) => { if (el.classList.contains('waiting')) el.hidden = base + at !== streaming; });
    const waiting = !!list.querySelector('.msg.waiting:not([hidden])');   // her reply's own bubble has the dots
    typing.classList.toggle('on', busy && !s.ask && !!last && last[0] === 'user' && !waiting);
    asking(s.ask);
  });
  document.title = (s.name || 'Luna') + ' · chat';
  lunaHead.update(s);
  const mic = $('#mic');
  mic.hidden = !s.can_talk;          // no push to talk in this Luna: no button that can't work
  mic.classList.toggle('on', !!s.mic);
  // the same as HOME in each voice mode (voice/ptt.py)
  mic.title = s.voice_mode === 'open'
    ? (s.mic ? 'hands-free is on - click to turn it off' : 'turn hands-free on (the same as HOME)')
    : s.mic ? (s.voice_mode === 'manual' ? 'listening - click when you\'re done' : 'listening - it stops when you go quiet')
    : 'dictate into the box: you send it (HOME still talks to Luna straight away)';
  dictated(s.dictated);
  buttons();
}

// --- thumbs: keep a reply as an example for her patches -------------------
// Up keeps it as she said it (like /good), down asks how it should have gone
// (like /fix) or, left empty, keeps it as a bad one. She never sees these.
// Line icons for the bar under her replies: copy, thumbs up and down, a tick after copying
const ICON = {
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></svg>',
  up: '<svg viewBox="0 0 24 24"><path d="M7 10v11"/><path d="M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 7a2 2 0 0 1-1.9 1.4H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h3l3.9-7.4a1.9 1.9 0 0 1 4.1 1.3z"/></svg>',
  down: '<svg viewBox="0 0 24 24"><g transform="matrix(1 0 0 -1 0 24)"><path d="M7 10v11"/><path d="M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 7a2 2 0 0 1-1.9 1.4H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h3l3.9-7.4a1.9 1.9 0 0 1 4.1 1.3z"/></g></svg>',
  done: '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  speak: '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  hush: '<svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>',     // pause: two bars, like the speaker it replaces
};
function thumbs() {
  els.forEach((el, at) => {
    const idx = base + at, bar = el.querySelector(':scope > .rate');
    if (idx === streaming || !el.classList.contains('her')) { if (bar) bar.remove(); return; }
    // rates[idx]: "" | up | fix | down (keepable), "tools" (a tool turn put right afterwards: can't be kept), missing (from before Luna started)
    const st = rates[idx] === undefined ? 'old' : rates[idx];
    const key = st + (replay === idx ? ' playing' : '');
    if (bar && bar.dataset.st === key) return;
    if (bar) bar.remove();
    const can = st !== 'old' && st !== 'tools';     // thumbs only where they work; copy on every reply
    const b = document.createElement('div'); b.className = 'rate' + (st === 'up' || st === 'fix' || st === 'down' ? ' done' : ''); b.dataset.st = key;
    b.innerHTML = `<span class=said>${st === 'up' ? 'kept as a good example' : st === 'fix' ? 'kept your version' : st === 'down' ? 'kept as a bad one' : ''}</span>
      <button class=copy data-r=copy title="copy" aria-label="copy">${ICON.copy}</button>${replay === idx
        ? `<button data-r=speak title="stop" aria-label="stop">${ICON.hush}</button>`
        : `<button data-r=speak title="say it again" aria-label="say it again">${ICON.speak}</button>`}${can
        ? `<button data-r=up aria-label="good reply">${ICON.up}</button><button data-r=down aria-label="bad reply">${ICON.down}</button>` : ''}`;
    if (can) {
      const up = b.querySelector('[data-r=up]'), dn = b.querySelector('[data-r=down]');
      up.title = "a good reply: keep it as an example for Luna's patches";
      dn.title = "not like this: say how it should have gone";
      up.classList.toggle('on', st === 'up');
      dn.classList.toggle('on', st === 'down' || st === 'fix');
      up.onclick = ev => { ev.stopPropagation(); rate(idx, true, ''); };
      dn.onclick = ev => { ev.stopPropagation(); better(el, b, idx); };
    }
    b.querySelector('[data-r=copy]').onclick = ev => { ev.stopPropagation(); copy(msgs[at] ? msgs[at][1] : '', ev.currentTarget); };
    b.querySelector('[data-r=speak]').onclick = ev => { ev.stopPropagation(); post('speak', {e, i: idx}); };
    el.appendChild(b);
  });
}
async function copy(words, btn) {
  try { await navigator.clipboard.writeText(words); }
  catch (err) {             // no clipboard API (plain http on another device): the old way
    const t = Object.assign(document.createElement('textarea'), {value: words});
    document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  }
  btn.innerHTML = ICON.done; setTimeout(() => { btn.innerHTML = ICON.copy; }, 1200);
}
// a code box's copy button: its code only, as written (one listener for every
// box, since her bubble is redrawn while she writes)
list.addEventListener('click', ev => {
  const btn = ev.target.closest('.copycode');
  if (!btn) return;
  ev.stopPropagation();
  copy(btn.closest('.code').querySelector('pre').textContent, btn);
});
function better(el, bar, idx) {
  if (el.querySelector('.better')) return;
  bar.classList.add('open');
  const f = document.createElement('div'); f.className = 'better';
  f.innerHTML = `<textarea placeholder="How should it have been said? (optional)"></textarea>
    <div class=row><button class=btn>Keep my version</button><button class="btn no" data-bad>Just mark it bad</button>
    <button class="btn no" data-x>Cancel</button></div>`;
  const ta = f.querySelector('textarea'), close = () => { f.remove(); bar.classList.remove('open'); };
  f.querySelector('.btn').onclick = () => { if (ta.value.trim()) rate(idx, false, ta.value).then(ok => ok && close()); else ta.focus(); };
  f.querySelector('[data-bad]').onclick = () => rate(idx, false, '').then(ok => ok && close());
  f.querySelector('[data-x]').onclick = close;
  f.onclick = ev => ev.stopPropagation();
  el.appendChild(f); ta.focus();
}
// Something that didn't work, said for a few seconds and gone; the line
// above the box (#err) is only for "can't reach Luna", which lasts
let toastTimer = 0;
function toast(words) {
  const t = $('#toast');
  t.textContent = words; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}
async function rate(idx, up, better) {
  try {
    const r = await fetch('rate', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({e, i: idx, up, better})});
    const out = await r.json().catch(() => ({}));
    if (!r.ok) { toast(out.error || ('error ' + r.status)); return false; }
    rates[idx] = out.rated; thumbs();
    return true;
  } catch (err) { toast("can't reach Luna - is it running?"); return false; }
}

// --- a tool asking first --------------------------------------------------
function asking(q) {
  if (!q) { if (askEl) askEl.remove(); askEl = null; askId = null; return; }
  if (askId !== q.id) {
    if (askEl) askEl.remove();
    askId = q.id;
    // floats over the chat, centred, until it's answered (or closes on its own)
    askEl = document.createElement('div'); askEl.className = 'askwrap';
    askEl.innerHTML = `<div class=ask><b></b><div class=note></div><pre></pre><div class=row>
      <button class=btn data-a=yes>Allow</button>${q.allow_all ? '<button class="btn no" data-a=all></button>' : ''}
      <button class="btn no" data-a=no>Deny</button><span class=left></span></div></div>`;
    askEl.querySelector('b').textContent = q.title;
    askEl.querySelector('.note').textContent = q.note || '';
    askEl.querySelector('pre').textContent = q.body.join('\n');
    if (!q.body.length) askEl.querySelector('pre').remove();
    const all = askEl.querySelector('[data-a=all]');
    if (all) all.textContent = 'Allow ' + q.allow_all;
    for (const b of askEl.querySelectorAll('[data-a]'))
      b.onclick = () => { for (const x of askEl.querySelectorAll('button')) x.disabled = true; post('answer', {id: q.id, answer: b.dataset.a}); };
    document.body.appendChild(askEl);     // (no focus on Allow: Enter while typing mustn't approve anything)
  }
  askEl.querySelector('.left').textContent = q.left + 's';
}

// --- keeping up -----------------------------------------------------------
async function follow() {
  for (;;) {
    try {
      const q = v === null ? `n=${base + msgs.length}` : `v=${v}&n=${base + msgs.length}&e=${e}`;
      const r = await fetch('state?' + q, {cache: 'no-store'});
      if (!r.ok) throw new Error(r.status);
      const s = await r.json();
      v = s.v; e = s.e;
      apply(s);
      if (offline) { offline = false; $('#err').textContent = ''; }
      lunaHead.reachable(true);
    } catch (err) {
      offline = true; lunaHead.reachable(false); $('#err').textContent = "can't reach Luna - is it running?";
      await new Promise(res => setTimeout(res, 2000));
    }
  }
}

// --- sending --------------------------------------------------------------
async function post(path, body, form) {
  try {
    const r = await fetch(path, form ? {method: 'POST', body: form}
      : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
    const out = await r.json().catch(() => ({}));
    if (!r.ok) { toast(out.error || ('error ' + r.status)); return false; }
    return true;
  } catch (err) { toast("can't reach Luna - is it running?"); return false; }
}

function buttons() {
  const typed = text.value.trim() || attached;
  const stopping = stoppable && !typed;
  send.classList.toggle('stop', stopping);
  send.textContent = stopping ? '■' : '➤';
  send.title = stopping ? 'stop' : 'send (Enter)';
}

async function go() {
  if (send.classList.contains('stop')) { post('stop'); return; }
  const words = text.value.trim();
  if (!words && !attached) return;
  if (words.length > BOOT.max) { toast(`keep it under ${BOOT.max} characters`); return; }
  send.disabled = true;
  let ok;
  if (attached) {
    const form = new FormData(); form.append('text', words); form.append('file', attached, attached.name || 'pasted.png');
    ok = await post('say', null, form);
  } else ok = await post('say', {text: words});
  send.disabled = false;
  if (ok) { text.value = ''; unattach(); grow(); log.scrollTop = log.scrollHeight; }
  buttons(); text.focus();
}
send.onclick = go;
// The mic's words land here, once each (DICTATED in web/chat_web.py), after
// anything already typed, for you to fix and send; only in the page whose
// mic was clicked. The first state a page gets only notes the id: an old
// dictation isn't pasted into a new page.
const PAGE = Math.random().toString(36).slice(2, 10);
$('#mic').onclick = () => post('dictate', {page: PAGE});
let heardId = null;
function dictated(d) {
  if (!d || d.id === heardId) return;
  const first = heardId === null;
  heardId = d.id;
  if (first || d.page !== PAGE || d.text === null) return;   // old, another page's, or stopped
  if (!d.text) { toast("didn't catch anything"); return; }
  const before = text.value;
  text.value = before + (before && !/\s$/.test(before) ? ' ' : '') + d.text;
  grow(); buttons(); text.focus();
  text.setSelectionRange(text.value.length, text.value.length);
}
text.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); go(); }
});
function grow() { text.style.height = 'auto'; text.style.height = Math.min(text.scrollHeight, innerHeight * .4) + 'px'; }
text.addEventListener('input', () => { grow(); buttons(); });

// --- one file a message ---------------------------------------------------
const files = BOOT.files || {}, images = (files.images || {}).types || [], docs = (files.documents || {}).types || [];
$('#file').accept = [...images, ...docs, '.md', '.txt'].join(',');
$('#clip').onclick = () => $('#file').click();
$('#file').onchange = () => { if ($('#file').files[0]) attach($('#file').files[0]); $('#file').value = ''; };
$('#unclip').onclick = unattach;
function attach(f) {
  const img = images.includes(f.type), cap = img ? (files.images || {}).max_bytes : (files.documents || {}).max_bytes;
  if (img && (files.images || {}).can_see === false) { toast("the model can't see pictures right now"); return; }
  if (cap && f.size > cap) { toast(`that's too big (up to ${Math.round(cap / 1048576)} MB)`); return; }
  attached = f;
  const chip = $('#chip'); chip.querySelector('img')?.remove();
  if (img) { const i = document.createElement('img'); i.src = URL.createObjectURL(f); chip.prepend(i); }
  $('#chipname').textContent = f.name || 'pasted picture';
  chip.classList.add('on'); buttons(); text.focus();
}
function unattach() { attached = null; $('#chip').classList.remove('on'); $('#chip').querySelector('img')?.remove(); buttons(); }
text.addEventListener('paste', ev => {
  const f = [...(ev.clipboardData?.files || [])][0];
  if (f) { ev.preventDefault(); attach(f); }
});
let drags = 0;
addEventListener('dragenter', ev => { if (ev.dataTransfer?.types?.includes('Files')) { drags++; document.body.classList.add('drag'); } });
addEventListener('dragleave', () => { if (--drags <= 0) { drags = 0; document.body.classList.remove('drag'); } });
addEventListener('dragover', ev => ev.preventDefault());
addEventListener('drop', ev => {
  ev.preventDefault(); drags = 0; document.body.classList.remove('drag');
  const f = ev.dataTransfer?.files?.[0]; if (f) attach(f);
});

follow();
text.focus();
</script>
