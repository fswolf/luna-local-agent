<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna</title>
<style>
  :root { --bg-top: #22142f; --bg-bottom: #0b0711; --text: #d9d4ec; --dim: #8880a8; --accent: #e07ac8; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(120% 90% at 50% 20%, var(--bg-top), var(--bg-bottom));
         color: var(--text); font: 12px/1.4 system-ui, sans-serif; }
  /* portrait.background: a colour or a picture you picked (boot.js); see-through
     for OBS and black for the fans still win, they come after */
  body.custom-bg { background: var(--user-bg) center / cover no-repeat fixed, #0b0711; }
  body.custom-bg.solid { background: var(--user-bg); }
  body.custom-bg.clear { background: transparent; }
  body.transparent { background: transparent !important; }
  body.transparent .bgfade { display: none; }
  body.fan { background: #000 !important; cursor: none; }
  body.fan #note { display: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #note { position: fixed; inset: auto 0 12px 0; text-align: center; color: var(--dim);
          pointer-events: none; transition: opacity .6s; }
  #note.hidden { opacity: 0; }
  #touchtip { position: fixed; pointer-events: none; color: var(--accent); font-weight: 600;
              text-shadow: 0 1px 3px #000; white-space: nowrap; }
  #debug, .panel { position: fixed; top: 8px; left: 8px; width: 360px; height: 60vh; min-width: 180px; min-height: 80px;
           max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow: auto; resize: both;
           background: #120d1ccc; border: 1px solid #3a2d55; border-radius: 8px; padding: 0 10px 8px;
           display: none; box-sizing: border-box; }
  #dbar, .pbar { position: sticky; top: 0; margin: 0 -10px; padding: 6px 10px; background: #1a1328; cursor: move;
          user-select: none; border-bottom: 1px solid #3a2d55; z-index: 1; }
  #dbar .hint, .pbar .hint { color: var(--dim); white-space: nowrap; }
  #debug details > summary, .panel details > summary { cursor: pointer; color: var(--accent); font-weight: 600; margin: 8px 0 2px; }
  body.debug #debug, body.debug .panel { display: block; }
  #debug button, .panel button { background: #2a2040; color: var(--text); border: 1px solid #4a3a70;
                  border-radius: 6px; padding: 3px 8px; margin: 2px; cursor: pointer; font: inherit; }
  #debug button:hover, .panel button:hover { border-color: var(--accent); }
  #debug pre, .panel pre { white-space: pre-wrap; margin: 6px 0 0; color: var(--dim); }
  #debug .dim, .panel .dim { color: var(--dim); margin: 2px 0; }
  #debug h4, .panel h4 { margin: 8px 0 2px; color: var(--accent); font-weight: 600; }
  #debug input[type=range], .panel input[type=range] { accent-color: var(--accent); vertical-align: middle; }
  #debug input[type=number], .panel input[type=number] { background: #2a2040; color: var(--text); border: 1px solid #4a3a70;
                              border-radius: 4px; font: inherit; padding: 1px 4px; }
  #debug select, .panel select { background: #2a2040; color: var(--text); border: 1px solid #4a3a70; border-radius: 6px; font: inherit; max-width: 100%; }
  /* windows.js: fold, tuck into the dock */
  #dbar, .pbar { display: flex; align-items: center; gap: 6px; }
  .pbar .hint { margin-left: auto; }
  #dbar b, .pbar b { white-space: nowrap; }
  .wbtns { margin-left: auto; white-space: nowrap; }
  .pbar .hint + .wbtns { margin-left: 0; }
  .wbtns button { padding: 0 6px !important; margin: 0 0 0 2px !important; line-height: 16px; }
  .folded { height: auto !important; resize: none !important; overflow: hidden !important; }
  .folded > :not(#dbar):not(.pbar) { display: none !important; }
  .tucked { display: none !important; }
  #dock { position: fixed; left: 8px; bottom: 8px; display: flex; gap: 6px; z-index: 5; }
  body:not(.debug) #dock { display: none; }
  .docktab { background: #2a2040; color: var(--text); border: 1px solid #4a3a70; border-radius: 6px;
             padding: 3px 10px; cursor: pointer; font: inherit; }
  .docktab:hover { border-color: var(--accent); }
  /* the pose studio */
  #studio { left: auto; right: 8px; top: 8px; width: 430px; height: 80vh; }
  /* top of the studio: what you're editing, the view, the timeline; then real tabs */
  .shead { padding: 6px 0 4px; border-bottom: 1px solid #3a2d55; }
  .shead select { max-width: 170px; }
  .now { margin: 4px 0 2px; padding: 4px 8px; border-radius: 6px; background: #1a1328; color: var(--text); }
  .now.dirty { box-shadow: inset 3px 0 0 #ffd36b; }
  .tabs { display: flex; gap: 2px; margin: 8px -10px 0; padding: 0 10px; border-bottom: 1px solid #4a3a70;
          position: sticky; top: 30px; background: #120d1cf2; z-index: 1; }
  #debug .tabs button, .panel .tabs button { flex: 1; margin: 0; padding: 6px 4px; border: 1px solid transparent; border-bottom: none;
                        border-radius: 6px 6px 0 0; background: transparent; color: var(--dim); }
  #debug .tabs button:hover, .panel .tabs button:hover { color: var(--text); border-color: transparent; background: #1a1328; }
  #debug .tabs button.on, .panel .tabs button.on { background: #2a2040; color: var(--accent); border-color: #4a3a70; font-weight: 600;
                           position: relative; top: 1px; }
  .page { padding-top: 6px; }
  #debug .tabs { position: static; }   /* its title bar changes height (her state), so the tabs scroll with the page */
  /* something waiting to be saved: filled orange-red and pulsing, hard to miss */
  .panel button.unsaved { background: #e8553a; border-color: #ff8a5c; color: #fff; font-weight: 600;
                          animation: unsaved 1.6s ease-in-out infinite; }
  @keyframes unsaved { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 110, 70, 0.7); } 50% { box-shadow: 0 0 0 5px rgba(255, 110, 70, 0); } }
  @media (prefers-reduced-motion: reduce) { .panel button.unsaved { animation: none; } }
  .page > .dim:first-child { margin-bottom: 6px; }
  .keys { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0; }
  .keys button.on { background: var(--accent); color: #120d1c; }
  .row { margin: 3px 0; }
  .row > span.l { display: inline-block; width: 74px; color: var(--dim); }
  .panel input[type=text] { background: #2a2040; color: var(--text); border: 1px solid #4a3a70;
                            border-radius: 4px; font: inherit; padding: 1px 4px; width: 230px; }
  .chips label { display: inline-block; margin: 1px 6px 1px 0; }
  .status { color: var(--accent); min-height: 1.2em; }
  .posing { color: #ff5a6a; font-weight: 600; font-size: 11px; white-space: nowrap; }
  canvas.timeline { display: block; width: 100%; height: 58px; cursor: pointer; border-radius: 6px; margin: 6px 0 2px; }
  .panel optgroup { color: var(--accent); }
  .panel optgroup option { color: var(--text); }
  .cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px;
              margin: 6px 0; padding: 6px; min-height: 60px; border: 1px dashed #4a3a70; border-radius: 6px; }
  .cardgrid.drop { border-color: var(--accent); background: #2a2040; }
  .cardgrid .card { position: relative; display: flex; flex-direction: column; }
  #debug .cardgrid button.put { display: flex; flex-direction: column; align-items: center; gap: 3px; margin: 0; padding: 3px;
                                background: #1c1530; border-radius: 6px; }
  .cardgrid button.put img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 4px; background: #0b0711; }
  .cardgrid button.put span { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .cardgrid .cact { position: absolute; top: 5px; right: 5px; display: none; gap: 2px; }
  .cardgrid .card:hover .cact, .cardgrid .card:focus-within .cact { display: flex; }
  .cardgrid .cact a, #debug .cardgrid .cact button { margin: 0; padding: 0 5px; line-height: 18px; font-size: 11px; border-radius: 4px;
                    background: #120d1ccc; border: 1px solid #4a3a70; color: var(--text); text-decoration: none; cursor: pointer; }
  #debug .chips label { white-space: nowrap; }
</style>
</head>
<body>
<div id="note">loading…</div>
<div id="debug" class="panel">
  <div id="dbar" class="pbar"><b>control panel</b> - <span id="dstate"></span>
    <span class="hint">h hides</span></div>
  <div class="tabs" id="dtabs"><button class="on" data-tab="dher">Model</button><button data-tab="dcards">Cards</button></div>
  <div class="page" id="dher">
  <h4>model</h4><select id="dmodel"></select>
  <h4>view</h4><div id="dview"></div>
  <div class="dim">left-drag turns her · wheel zooms · double-click resets</div>
  <h4>try</h4>
  <div id="dbuttons"></div>
  <h4>clips</h4><div id="dclips"><span class="dim">none in portrait/animations</span></div>
  <h4>tune</h4><div id="dtune"></div>
  <details data-key="ears"><summary>ears</summary><pre id="dears"></pre></details>
  <details data-key="expr"><summary>expressions</summary><pre id="dexpr"></pre></details>
  <details data-key="bones"><summary>bones that might be ears or hair</summary><pre id="dbones"></pre></details>
  </div>
  <div class="page" id="dcards" hidden></div>
</div>
<script type="module" src="./boot.js"></script>
</body>
</html>
